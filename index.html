  <!-- Launch logo: shown before the app's code loads, then flies off (src/splash.js) once the first screen is ready. -->
  <style>
    #splash { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: #15100C; --sp-ink: #F8F2E7; transition: opacity 0.25s ease 0.3s; }
    html.sp-light #splash { background: #F3EFE4; --sp-ink: #0C1124; }
    #splash svg { width: 132px; height: auto; animation: sp-in 0.35s cubic-bezier(.2,1.4,.4,1) both; }
    #splash.go { opacity: 0; pointer-events: none; }
    #splash.go svg { animation: sp-fly 0.55s cubic-bezier(.55,-0.35,.75,.35) forwards; }
    @keyframes sp-in { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes sp-fly { 0% { transform: translateX(0) rotate(0); } 25% { transform: translateX(-18px) rotate(4deg); } 100% { transform: translateX(110vw) translateY(-14vh) rotate(-18deg); } }
    @media (prefers-reduced-motion: reduce) { #splash svg, #splash.go svg { animation: none; } #splash { transition-delay: 0s; } }
  </style>
  <script>
    // Match the saved theme before anything paints.
    (function () { var t = 'dark'; try { t = JSON.parse(localStorage.getItem('fr.theme')) || 'dark'; } catch (e) {}
      var light = t === 'light' || (t === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
      if (light) document.documentElement.className += ' sp-light'; })();
